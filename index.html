<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编程语言转换器</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #232344;
    --border: #2a2a4a;
    --text: #e0e0f0;
    --text2: #8888aa;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --green: #00cec9;
    --orange: #fd79a8;
    --blue: #74b9ff;
    --radius: 12px;
    --font: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    --toast-bg: var(--surface);
  }
  body.light {
    --bg: #f0f0f8;
    --surface: #ffffff;
    --surface2: #e8e8f0;
    --border: #d0d0e0;
    --text: #1a1a2e;
    --text2: #666688;
    --toast-bg: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent2), var(--green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header h1 span { font-size: 14px; -webkit-text-fill-color: var(--text2); font-weight: 400; margin-left: 8px; }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .badge {
    font-size: 12px; padding: 4px 12px; border-radius: 20px;
    background: var(--surface2); color: var(--text2); border: 1px solid var(--border);
  }
  .theme-toggle {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: 0.2s;
  }
  .theme-toggle:hover { border-color: var(--accent); background: var(--surface); }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px 32px; flex: 1; width: 100%; display: flex; flex-direction: column; min-height: 0; }
  .editor-grid-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; min-height: 0; grid-template-rows: 1fr; }
  .toolbar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    margin-bottom: 20px; padding: 16px; background: var(--surface);
    border-radius: var(--radius); border: 1px solid var(--border);
  }
  .toolbar-group { display: flex; align-items: center; gap: 8px; }
  .toolbar-group label { font-size: 13px; color: var(--text2); font-weight: 500; white-space: nowrap; }
  select {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer;
    outline: none; transition: 0.2s; font-family: inherit;
  }
  select:hover, select:focus { border-color: var(--accent); }
  .btn {
    padding: 8px 20px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: 0.15s; display: inline-flex; align-items: center; gap: 6px;
    font-family: inherit; user-select: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #8b7cf7);
    color: #fff; box-shadow: 0 4px 15px rgba(108,92,231,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,92,231,0.4); }
  .btn-secondary {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-success {
    background: linear-gradient(135deg, #00b894, #00cec9);
    color: #fff; box-shadow: 0 4px 15px rgba(0,206,201,0.3);
  }
  .btn-success:hover { transform: translateY(-1px); }
  .btn-icon { padding: 8px 12px; font-size: 16px; }
  @media (max-width: 900px) {
    .editor-grid { grid-template-columns: 1fr; }
    .container { padding: 16px; }
    header { padding: 16px; }
  }
  .editor-panel {
    background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); overflow: hidden;
    display: flex; flex-direction: column; min-height: 0; height: 100%;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .editor-panel:hover { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(108,92,231,0.08); }
  .editor-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }
  .editor-header .lang-label {
    font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  .lang-dot {
    width: 10px; height: 10px; border-radius: 50%; display: inline-block;
  }
  .editor-meta { font-size: 12px; color: var(--text2); display: flex; gap: 12px; }
  .code-area {
    position: relative; flex: 1; display: flex; flex-direction: column;
  }
  .code-area .CodeMirror {
    flex: 1; height: 100%; min-height: 420px;
  }
  .code-area .CodeMirror-scroll { min-height: 420px; }
  .status-bar {
    padding: 10px 16px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text2); display: flex; justify-content: space-between;
  }
  .status-bar .error { color: var(--orange); }
  .status-bar .success { color: var(--green); }
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    padding: 12px 24px; border-radius: 8px; font-size: 14px;
    background: var(--toast-bg); border: 1px solid var(--border);
    color: var(--text); box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    opacity: 0; transition: 0.3s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }

  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid var(--text2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .examples {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .examples .chip {
    font-size: 12px; padding: 4px 12px; border-radius: 16px;
    background: var(--surface2); color: var(--text2); border: 1px solid var(--border);
    cursor: pointer; transition: 0.2s;
  }
  .examples .chip:hover { border-color: var(--accent); color: var(--accent2); }

  /* ---- 主题过渡 ---- */
  body, body::before, .editor-panel, .toolbar, .editor-header, .status-bar,
  select, .theme-toggle, .toast,
  .CodeMirror, .CodeMirror-gutters, .CodeMirror-linenumber {
    transition: background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease, box-shadow 0.35s ease;
  }

  /* ---- CodeMirror 自定义主题 (适配明暗) ---- */
  .CodeMirror {
    font-family: var(--font); font-size: 14px; line-height: 1.6;
    height: auto; min-height: 400px;
    background: transparent; color: var(--text);
  }
  .CodeMirror-gutters {
    background: var(--surface); border-right: 1px solid var(--border);
  }
  .CodeMirror-linenumber {
    color: var(--text2) !important; opacity: 0.5;
  }
  .CodeMirror-cursor { border-left-color: var(--accent) !important; }
  .CodeMirror-selected { background: rgba(108,92,231,0.15) !important; }
  .CodeMirror-activeline-background { background: rgba(108,92,231,0.06) !important; }
  .CodeMirror-matchingbracket {
    background: rgba(0,206,201,0.15) !important;
    border-bottom: 1px solid var(--green) !important;
    color: var(--text) !important;
  }
  .CodeMirror-foldmarker {
    color: var(--text2); font-family: sans-serif; cursor: pointer;
  }
  .CodeMirror-foldgutter-open, .CodeMirror-foldgutter-closed {
    cursor: pointer; color: var(--text2); opacity: 0.6;
  }
  .cm-s-default .cm-keyword { color: #c792ea; }
  .cm-s-default .cm-atom { color: #f78c6c; }
  .cm-s-default .cm-number { color: #f78c6c; }
  .cm-s-default .cm-def { color: #82aaff; }
  .cm-s-default .cm-variable { color: var(--text); }
  .cm-s-default .cm-variable-2 { color: #80cbc4; }
  .cm-s-default .cm-variable-3 { color: #decb6b; }
  .cm-s-default .cm-property { color: #80cbc4; }
  .cm-s-default .cm-operator { color: #89ddff; }
  .cm-s-default .cm-comment { color: #546e7a; font-style: italic; }
  .cm-s-default .cm-string { color: #c3e88d; }
  .cm-s-default .cm-string-2 { color: #f07178; }
  .cm-s-default .cm-meta { color: #ffcb6b; }
  .cm-s-default .cm-qualifier { color: #decb6b; }
  .cm-s-default .cm-builtin { color: #82aaff; }
  .cm-s-default .cm-bracket { color: var(--text2); }
  .cm-s-default .cm-tag { color: #f07178; }
  .cm-s-default .cm-attribute { color: #c792ea; }
  .cm-s-default .cm-hr { color: #999; }
  .cm-s-default .cm-link { color: #80cbc4; }
  body.light .cm-s-default .cm-comment { color: #90a4ae; }
  body.light .cm-s-default .cm-string { color: #6a8759; }
  body.light .cm-s-default .cm-number { color: #ab6526; }
  body.light .cm-s-default .cm-atom { color: #ab6526; }
  body.light .cm-s-default .cm-keyword { color: #7b3ba7; }
  body.light .cm-s-default .cm-def { color: #2f6f9f; }
  body.light .cm-s-default .cm-variable-2 { color: #2f6f9f; }
  body.light .cm-s-default .cm-variable-3 { color: #6f6f2f; }
  body.light .cm-s-default .cm-property { color: #2f6f9f; }
  body.light .cm-s-default .cm-operator { color: #5f5f5f; }
  body.light .cm-s-default .cm-tag { color: #b52f2f; }
  body.light .cm-s-default .cm-attribute { color: #7b3ba7; }
  .CodeMirror-placeholder { color: var(--text2) !important; opacity: 0.5 !important; }

  .cm-s-default .CodeMirror-activeline-background { background: rgba(108,92,231,0.04) !important; }
  .cm-s-default .CodeMirror-matchingtag { background: rgba(0,206,201,0.1); }

  /* ---- 源码弹窗 ---- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.7);
    display: flex; flex-direction: column;
    visibility: hidden; opacity: 0;
    transition: opacity 0.25s, visibility 0.25s;
  }
  .modal-overlay.open { visibility: visible; opacity: 1; }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .modal-title { font-size: 15px; font-weight: 600; }
  .modal-actions { display: flex; gap: 10px; }
  .modal-body { flex: 1; min-height: 0; padding: 16px 24px 24px; display: flex; }
  .modal-code-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .modal-code-area .CodeMirror {
    flex: 1; height: 100%; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .modal-code-area textarea { display: block; width: 100%; height: 100%; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/go/go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/fold/brace-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/fold/indent-fold.min.js"></script>

<body>

<header>
  <h1>&#x3C;/&#x3E; 编程语言转换器 <span>Code Converter</span></h1>
  <div class="header-actions">
    <div class="badge">v1.1</div>
    <div class="badge">规则引擎</div>
    <button class="theme-toggle" id="themeToggle" title="切换主题">&#9790;</button>
  </div>
</header>

<div class="container">
  <div class="toolbar">
    <div class="toolbar-group">
      <label>源语言</label>
      <select id="fromLang">
        <option value="python">Python</option>
        <option value="javascript">JavaScript</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
        <option value="typescript">TypeScript</option>
        <option value="go">Go</option>
      </select>
    </div>
    <div class="toolbar-group">
      <label>目标语言</label>
      <select id="toLang">
        <option value="javascript">JavaScript</option>
        <option value="python">Python</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
        <option value="typescript">TypeScript</option>
        <option value="go">Go</option>
      </select>
    </div>
    <button class="btn btn-primary" id="convertBtn">&#9654; 转换</button>
    <button class="btn btn-secondary" id="swapBtn">&#8646; 互换</button>
    <button class="btn btn-secondary" id="clearAllBtn">&#x1F5D1; 清空</button>
    <button class="btn btn-secondary" id="viewSourceBtn">&#x1F4C4; 查看源码</button>
    <div class="examples">
      <span class="chip" data-example="hello">Hello World</span>
      <span class="chip" data-example="fib">斐波那契</span>
      <span class="chip" data-example="class">类定义</span>
      <span class="chip" data-example="sort">排序算法</span>
    </div>
  </div>

  <div class="editor-grid-wrap">
    <div class="editor-grid">
      <div class="editor-panel">
        <div class="editor-header">
          <span class="lang-label">
            <span class="lang-dot" style="background:var(--blue)"></span>
            <span id="fromLabel">Python</span>
          </span>
          <div class="editor-meta">
            <span id="fromStats">0 行</span>
            <button class="btn btn-secondary btn-icon" id="clearBtn" title="清空">&#x1F5D1;</button>
          </div>
        </div>
        <div class="code-area">
          <textarea id="sourceCode" placeholder="在此粘贴源代码..." spellcheck="false"></textarea>
        </div>
      </div>

      <div class="editor-panel">
        <div class="editor-header">
          <span class="lang-label">
            <span class="lang-dot" style="background:var(--green)"></span>
            <span id="toLabel">JavaScript</span>
          </span>
          <div class="editor-meta">
            <span id="toStats">0 行</span>
            <button class="btn btn-secondary btn-icon" id="copyBtn" title="复制结果">&#x1F4CB;</button>
          </div>
        </div>
        <div class="code-area">
          <textarea id="resultCode" placeholder="转换后的代码将显示在此处..." spellcheck="false" readonly></textarea>
        </div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="statusMsg">就绪</span>
    <span id="statusExtra"></span>
  </div>
  <div style="text-align:center;padding:16px 0 4px;font-size:12px;color:var(--text2);opacity:0.6;border-top:1px solid var(--border);margin-top:20px">
    本工具所有代码转换运算在本地浏览器执行，不会上传您粘贴的代码至任何服务器。
  </div>
  <div style="text-align:center;padding:4px 0 4px;font-size:12px;color:var(--text2);opacity:0.5">
    代码编辑器推荐本地安装 Cascadia Code / Fira Code / JetBrains Mono 获得最佳显示效果。
  </div>
  <div style="text-align:center;padding:4px 0 16px;font-size:12px;color:var(--orange);opacity:0.7">
    &#x26A0;&#xFE0F; 自动代码转换结果仅作参考，请人工校验代码逻辑，工具不保证转换代码可直接运行。
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 查看源码弹窗 -->
<div class="modal-overlay" id="sourceModal">
  <div class="modal-header">
    <span class="modal-title">&#x1F4C4; 页面完整源码</span>
    <div class="modal-actions">
      <button class="btn btn-success" id="modalCopyBtn">&#x1F4CB; 一键复制全部源码</button>
      <button class="btn btn-secondary" id="modalCloseBtn">&#x2715; 关闭</button>
    </div>
  </div>
  <div class="modal-body">
    <div class="modal-code-area">
      <textarea id="modalSourceCode" spellcheck="false" readonly></textarea>
    </div>
  </div>
</div>

<script>
// ============================================================
// 语言配色 & 名称
// ============================================================
const LANG_INFO = {
  python:     { color: '#3572A5', name: 'Python' },
  javascript: { color: '#f7df1e', name: 'JavaScript' },
  java:       { color: '#b07219', name: 'Java' },
  cpp:        { color: '#f34b7d', name: 'C++' },
  typescript: { color: '#3178c6', name: 'TypeScript' },
  go:         { color: '#00ADD8', name: 'Go' },
};

// ============================================================
// 示例代码
// ============================================================
const EXAMPLES = {
  hello: {
    python: 'print("Hello, World!")\nprint(f"你好, {input(\"请输入名字: \")}")',
    javascript: 'console.log("Hello, World!");\nconst name = prompt("请输入名字: ");\nconsole.log(`你好, ${name}`);',
    java: 'public class Main {\n  public static void main(String[] args) {\n    System.out.println("Hello, World!");\n    System.out.print("请输入名字: ");\n    var sc = new java.util.Scanner(System.in);\n    var name = sc.nextLine();\n    System.out.println("你好, " + name);\n  }\n}',
    cpp: '#include <iostream>\n#include <string>\nint main() {\n  std::cout << "Hello, World!" << std::endl;\n  std::string name;\n  std::cout << "请输入名字: ";\n  std::cin >> name;\n  std::cout << "你好, " << name << std::endl;\n  return 0;\n}',
    typescript: 'function greet(name: string): void {\n  console.log(`Hello, ${name}!`);\n}\ngreet("World");',
    go: 'package main\nimport "fmt"\nfunc main() {\n  fmt.Println("Hello, World!")\n  var name string\n  fmt.Print("请输入名字: ")\n  fmt.Scan(&name)\n  fmt.Printf("你好, %s\\n", name)\n}',
  },
  fib: {
    python: 'def fibonacci(n):\n  if n <= 1:\n    return n\n  return fibonacci(n-1) + fibonacci(n-2)\n\nn = 10\nfor i in range(n):\n  print(fibonacci(i))',
    javascript: 'function fibonacci(n) {\n  if (n <= 1) return n;\n  return fibonacci(n-1) + fibonacci(n-2);\n}\n\nconst n = 10;\nfor (let i = 0; i < n; i++) {\n  console.log(fibonacci(i));\n}',
    java: 'public class Fibonacci {\n  static int fibonacci(int n) {\n    if (n <= 1) return n;\n    return fibonacci(n-1) + fibonacci(n-2);\n  }\n  public static void main(String[] args) {\n    int n = 10;\n    for (int i = 0; i < n; i++) {\n      System.out.println(fibonacci(i));\n    }\n  }\n}',
    cpp: '#include <iostream>\nint fibonacci(int n) {\n  if (n <= 1) return n;\n  return fibonacci(n-1) + fibonacci(n-2);\n}\nint main() {\n  int n = 10;\n  for (int i = 0; i < n; i++) {\n    std::cout << fibonacci(i) << std::endl;\n  }\n  return 0;\n}',
    typescript: 'function fibonacci(n: number): number {\n  if (n <= 1) return n;\n  return fibonacci(n-1) + fibonacci(n-2);\n}\nconst n = 10;\nfor (let i = 0; i < n; i++) {\n  console.log(fibonacci(i));\n}',
    go: 'package main\nimport "fmt"\nfunc fibonacci(n int) int {\n  if n <= 1 { return n }\n  return fibonacci(n-1) + fibonacci(n-2)\n}\nfunc main() {\n  n := 10\n  for i := 0; i < n; i++ {\n    fmt.Println(fibonacci(i))\n  }\n}',
  },

const CONVERTERS = {
  // ---- Python -> JavaScript ----
  python_javascript(code) {
    let r = code;
    // 注释
    r = r.replace(/# (.*)/g, '// $1');
    // 函数定义 def -> function
    r = r.replace(/def\s+(\w+)\s*\(([^)]*)\)\s*:/g, 'function $1($2) {');
    // print -> console.log
    r = r.replace(/print\s*\(([^)]*)\)/g, 'console.log($1);');
    // input -> prompt
    r = r.replace(/input\s*\(([^)]*)\)/g, 'prompt($1)');
    // elif -> else if
    r = r.replace(/elif\s+/g, '} else if ');
    // else:
    r = r.replace(/else\s*:/g, '} else {');
    // if / while / for 条件后的冒号
    r = r.replace(/(\b(?:if|while|for)\s*\([^)]*\))\s*:/g, '$1 {');
    r = r.replace(/(\b(?:if|while|for)\s[^:]+):/g, '$1 {');
    // range(n) -> Array.from({length:n},(_,i)=>i)
    r = r.replace(/range\s*\(\s*(\d+)\s*\)/g, (_,n) => `Array.from({length:${n}},(_,i)=>i)`);
    r = r.replace(/range\s*\(\s*(\w+)\s*\)/g, (_,v) => `Array.from({length:${v}},(_,i)=>i)`);
    // len(x) -> x.length
    r = r.replace(/\blen\s*\(([^)]*)\)/g, '$1.length');
    // str() / int() 等类型转换保留
    // self.xxx -> this.xxx
    r = r.replace(/self\./g, 'this.');
    // __init__ -> constructor
    r = r.replace(/\b__init__\b/g, 'constructor');
    // class 定义
    r = r.replace(/class\s+(\w+)\s*\(([^)]*)\)\s*:/g, 'class $1 extends $2 {');
    r = r.replace(/class\s+(\w+)\s*:/g, 'class $1 {');
    // True/False/None -> true/false/null
    r = r.replace(/\bTrue\b/g, 'true');
    r = r.replace(/\bFalse\b/g, 'false');
    r = r.replace(/\bNone\b/g, 'null');
    // and/or/not -> &&/||/!
    r = r.replace(/\band\b/g, '&&');
    r = r.replace(/\bor\b/g, '||');
    r = r.replace(/\bnot\s+/g, '!');
    // append -> push
    r = r.replace(/\.append\s*\(/g, '.push(');
    // del x[i] -> delete x[i] 或 splice
    r = r.replace(/del\s+(\w+)\[([^\]]+)\]/g, 'delete $1[$2]');
    // in -> includes (简化)
    r = r.replace(/(\w+)\s+in\s+(\w+)/g, (m,a,b) => `${b}.includes(${a})`);
    // for x in y: -> for (let x of y) {
    r = r.replace(/for\s+(\w+)\s+in\s+(\w+)\s*\{/g, 'for (let $1 of $2) {');
    // try/except -> try/catch
    r = r.replace(/except\s+(\w+)\s*:/g, 'catch ($1) {');
    r = r.replace(/except\s*:/g, 'catch {');
    r = r.replace(/try\s*:/g, 'try {');
    // finally:
    r = r.replace(/finally\s*:/g, 'finally {');
    // 列表推导 [x for x in y] -> Array.from(y).map(x=>x)
    r = r.replace(/\[(\w+)\s+for\s+\w+\s+in\s+(\w+)\]/g, (_,x,y) => `${y}.map(${x}=>${x})`);
    // f-string "f..." -> 模板字符串
    r = r.replace(/f(["'])`/g, '`');
    r = r.replace(/f(["'])([^"']*)\1/g, '`$2`');
    return r;
  },

  // ---- JavaScript -> Python ----
  javascript_python(code) {
    let r = code;
    // 单行注释
    r = r.replace(/\/\/\s*(.*)/g, '# $1');
    // 多行注释 /**/ 基本保留
    // console.log -> print
    r = r.replace(/console\.log\s*\(([^)]*)\)/g, 'print($1)');
    // prompt -> input
    r = r.replace(/prompt\s*\(([^)]*)\)/g, 'input($1)');
    // function -> def
    r = r.replace(/function\s+(\w+)\s*\(([^)]*)\)\s*\{/g, 'def $1($2):');
    // 箭头函数 (x)=> 转为 def
    r = r.replace(/(\w+)\s*=\s*\(([^)]*)\)\s*=>\s*\{/g, 'def $1($2):');
    // const/let/var -> 无
    r = r.replace(/\b(const|let|var)\s+/g, '');
    // === / !== -> == / !=
    r = r.replace(/===/g, '==');
    r = r.replace(/!==/g, '!=');
    // this. -> self.
    r = r.replace(/this\./g, 'self.');
    // constructor -> __init__
    r = r.replace(/\bconstructor\b/g, '__init__');
    // class extends
    r = r.replace(/class\s+(\w+)\s+extends\s+(\w+)\s*\{/g, 'class $1($2):');
    r = r.replace(/class\s+(\w+)\s*\{/g, 'class $1:');
    // true/false/null
    r = r.replace(/\btrue\b/g, 'True');
    r = r.replace(/\bfalse\b/g, 'False');
    r = r.replace(/\bnull\b/g, 'None');
    // && / || / !
    r = r.replace(/&&/g, 'and');
    r = r.replace(/\|\|/g, 'or');
    // ! 需要小心处理
    r = r.replace(/!\s*(\w+)/g, 'not $1');
    // .push -> .append
    r = r.replace(/\.push\s*\(/g, '.append(');
    // .length -> len()
    r = r.replace(/(\w+)\.length\b/g, 'len($1)');
    // .includes -> in
    r = r.replace(/(\w+)\.includes\(([^)]*)\)/g, '$2 in $1');
    // for...of -> for...in
    r = r.replace(/for\s*\(let\s+(\w+)\s+of\s+(\w+)\)\s*\{/g, 'for $1 in $2:');
    // try/catch
    r = r.replace(/try\s*\{/g, 'try:');
    r = r.replace(/catch\s*\(([^)]*)\)\s*\{/g, 'except $1:');
    r = r.replace(/catch\s*\{/g, 'except:');
    // else if -> elif
    r = r.replace(/}\s*else\s+if\s*\(/g, 'elif ');
    // 移除末尾的分号
    r = r.replace(/;\s*$/gm, '');
    // 模板字符串 -> f-string
    r = r.replace(/`([^`]*)`/g, (m, s) => {
      let fs = s.replace(/\$\{([^}]+)\}/g, '{$1}');
      return fs.includes('{') ? `f"${fs}"` : `"${fs}"`;
    });
    // new Xxx() 保留但去掉 new
    r = r.replace(/\bnew\s+/g, '');
    return r;
  },

      result.push('func main() {');
      result.push('\t// TODO');
      result.push('}');
    }
    r = result.join('\n');
    r = r.replace(/\bTrue\b/g, 'true');
    r = r.replace(/\bFalse\b/g, 'false');
    r = r.replace(/\bNone\b/g, 'nil');
    r = r.replace(/self\./g, '');
    return r;
  },

  // ---- Go -> Python ----
  go_python(code) {
    let r = code;
    r = r.replace(/\/\/\s*(.*)/g, '# $1');
    r = r.replace(/fmt\.Println\s*\(([^)]*)\)/g, 'print($1)');
    r = r.replace(/fmt\.Printf\s*\([^)]*\)/g, 'print(...)');
    r = r.replace(/func\s+(\w+)\s*\(([^)]*)\)\s*(int|string|bool|float64)?\s*\{/g, (m,name,params) => {
      let ps = params.split(',').map(s => s.trim()).filter(Boolean);
      ps = ps.map(p => p.replace(/\s+\w+$/, '').trim()).filter(Boolean);
      return `def ${name}(${ps.join(', ')}):`;
    });
    r = r.replace(/func\s+main\s*\([^)]*\)\s*\{/g, 'def main():');
    r = r.replace(/package\s+\w+/g, '');
    r = r.replace(/import\s*"[^"]*"/g, '');
    r = r.replace(/var\s+(\w+)\s+(\w+)\s*=/g, '$1 =');
    r = r.replace(/(\w+)\s*:=\s*/g, '$1 = ');
    r = r.replace(/for\s+(\w+)\s*:=\s*(\d+);\s*\w+\s*<\s*(\d+);\s*\w+\+\+\s*\{/g, 'for $1 in range($3):');
    r = r.replace(/for\s+_,\s*(\w+)\s*:=\s*range\s*\(([^)]*)\)\s*\{/g, 'for $1 in $2:');
    r = r.replace(/for\s+\{/g, 'while True:');
    r = r.replace(/\btrue\b/g, 'True');
    r = r.replace(/\bfalse\b/g, 'False');
    r = r.replace(/\bnil\b/g, 'None');
    r = r.replace(/fmt\.Scan\s*\(&([^)]*)\)/g, '$1 = input()');
    r = r.replace(/;\s*$/gm, '');
    return r.trim();
  },

  // 通用 fallback
  fallback(code, from, to) {
    let r = code;
    // 尝试基本的注释转换
    if (from === 'python') r = r.replace(/# (.*)/g, '// $1');
    else r = r.replace(/\/\/\s*(.*)/g, '# $1');
    return `// 转换 ${from} -> ${to} 暂不支持完整规则\n// 以下为原始代码:\n\n${code}`;
  }
};

// ============================================================
// 核心转换函数
// ============================================================
function convertCode(code, from, to) {
  if (!code.trim()) return '';
  const key = `${from}_${to}`;
  if (CONVERTERS[key]) {
    try {
      return CONVERTERS[key](code);
    } catch (e) {
      return `// 转换出错: ${e.message}\n\n${code}`;
    }
  }
  // 尝试反向转换
  const reverseKey = `${to}_${from}`;
  if (CONVERTERS[reverseKey]) {
    // 已经在目标中有转换器，但方向不对
    return CONVERTERS.fallback(code, from, to);
  }
  return CONVERTERS.fallback(code, from, to);
}

// ============================================================
// UI 交互
// ============================================================
const fromLang = document.getElementById('fromLang');
const toLang = document.getElementById('toLang');
const fromLabel = document.getElementById('fromLabel');
const toLabel = document.getElementById('toLabel');
const fromStats = document.getElementById('fromStats');
const toStats = document.getElementById('toStats');
const statusMsg = document.getElementById('statusMsg');
const statusExtra = document.getElementById('statusExtra');
const convertBtn = document.getElementById('convertBtn');
const themeToggle = document.getElementById('themeToggle');
let isConverting = false;

// ---- CodeMirror 模式映射 ----
const CM_MODE = {
  python: 'python',
  javascript: 'javascript',
  java: 'text/x-java',
  cpp: 'text/x-c++src',
  typescript: 'text/typescript',
  go: 'go',
};

// ---- CodeMirror 编辑器实例 ----
const sourceEditor = CodeMirror.fromTextArea(document.getElementById('sourceCode'), {
  mode: CM_MODE[fromLang.value],
  lineNumbers: true,
  matchBrackets: true,
  indentUnit: 2,
  tabSize: 2,
  lineWrapping: false,
  foldGutter: true,
  gutters: ['CodeMirror-foldgutter', 'CodeMirror-linenumbers'],
  styleActiveLine: true,
  placeholder: '在此粘贴源代码...',
});

const resultEditor = CodeMirror.fromTextArea(document.getElementById('resultCode'), {
  mode: CM_MODE[toLang.value],
  lineNumbers: true,
  matchBrackets: true,
  indentUnit: 2,
  tabSize: 2,
  lineWrapping: false,
  readOnly: true,
  foldGutter: true,
  gutters: ['CodeMirror-foldgutter', 'CodeMirror-linenumbers'],
  placeholder: '转换后的代码将显示在此处...',
});

// 切换语言时同步 CodeMirror mode
function syncSourceMode() {
  sourceEditor.setOption('mode', CM_MODE[fromLang.value]);
}
function syncResultMode() {
  resultEditor.setOption('mode', CM_MODE[toLang.value]);
}

// ---- 主题切换 ----
function setTheme(theme) {
  document.body.classList.toggle('light', theme === 'light');
  themeToggle.textContent = theme === 'light' ? '\u2600' : '\u263E';
  try { localStorage.setItem('code-converter-theme', theme); } catch {}
}
function toggleTheme() {
  const isLight = document.body.classList.contains('light');
  setTheme(isLight ? 'dark' : 'light');
}
try {
  const saved = localStorage.getItem('code-converter-theme');
  if (saved) setTheme(saved);
  else if (window.matchMedia('(prefers-color-scheme: light)').matches) setTheme('light');
} catch {}

function updateLabels() {
  const fi = LANG_INFO[fromLang.value];
  const ti = LANG_INFO[toLang.value];
  fromLabel.textContent = fi.name;
  toLabel.textContent = ti.name;
}

function updateStats() {
  const sl = sourceEditor.lineCount();
  const tl = resultEditor.lineCount();
  fromStats.textContent = `${sl} 行`;
  toStats.textContent = `${tl} 行`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

function doConvert() {
  if (isConverting) return;

  const code = sourceEditor.getValue();
  const from = fromLang.value;
  const to = toLang.value;

  if (!code.trim()) {
    resultEditor.setValue('');
    statusMsg.textContent = '请先输入代码';
    statusMsg.className = '';
    updateStats();
    return;
  }

  isConverting = true;
  convertBtn.disabled = true;
  convertBtn.innerHTML = '<span class="spinner"></span> 转换中';
  statusMsg.textContent = '转换中...';
  statusMsg.className = '';
  const start = performance.now();

  setTimeout(() => {
    try {
      const result = convertCode(code, from, to);
      const elapsed = ((performance.now() - start) / 1000).toFixed(2);

      resultEditor.setValue(result);
      updateStats();

      if (from === to) {
        statusMsg.textContent = `提示: 源语言和目标语言相同 (${elapsed}s)`;
        statusMsg.className = '';
      } else if (result.startsWith('// 转换')) {
        statusMsg.textContent = `部分转换 (${elapsed}s)`;
        statusMsg.className = 'error';
        showToast('该语言组合暂未实现完整转换规则');
      } else {
        statusMsg.textContent = `转换完成 (${elapsed}s)`;
        statusMsg.className = 'success';
      }
      statusExtra.textContent = `${result.split('\n').length} 行`;
    } catch (e) {
      statusMsg.textContent = '转换失败';
      statusMsg.className = 'error';
      showToast(`转换出错: ${e.message}`);
    } finally {
      isConverting = false;
      convertBtn.disabled = false;
      convertBtn.innerHTML = '&#9654; 转换';
    }
  }, 80);
}

function swapLanguages() {
  const tmp = fromLang.value;
  fromLang.value = toLang.value;
  toLang.value = tmp;
  updateLabels();
  syncSourceMode();
  syncResultMode();
  doConvert();
}

function loadExample(name) {
  const from = fromLang.value;
  const ex = EXAMPLES[name];
  if (ex && ex[from]) {
    sourceEditor.setValue(ex[from]);
    updateStats();
    doConvert();
  } else {
    for (const lang of Object.keys(ex || {})) {
      sourceEditor.setValue(ex[lang]);
      fromLang.value = lang;
      updateLabels();
      syncSourceMode();
      updateStats();
      doConvert();
      return;
    }
    sourceEditor.setValue('// 该语言暂无示例');
  }
}

function copyResult() {
  const text = resultEditor.getValue();
  if (!text) { showToast('没有可复制的内容'); return; }
  navigator.clipboard.writeText(text).then(() => {
    showToast('已复制到剪贴板');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    showToast('已复制到剪贴板');
  });
}

function updateConvertBtn() {
  convertBtn.disabled = !sourceEditor.getValue().trim();
}

// ============================================================
// 事件绑定
// ============================================================
document.getElementById('convertBtn').addEventListener('click', doConvert);
document.getElementById('swapBtn').addEventListener('click', swapLanguages);
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
document.getElementById('clearBtn').addEventListener('click', () => {
  sourceEditor.setValue('');
  updateConvertBtn();
  updateStats();
  statusMsg.textContent = '已清空源码';
  statusMsg.className = '';
  statusExtra.textContent = '';
});
document.getElementById('clearAllBtn').addEventListener('click', () => {
  sourceEditor.setValue('');
  resultEditor.setValue('');
  updateConvertBtn();
  updateStats();
  statusMsg.textContent = '已清空全部';
  statusMsg.className = '';
  statusExtra.textContent = '';
  showToast('已清空双编辑器');
});
document.getElementById('copyBtn').addEventListener('click', copyResult);

fromLang.addEventListener('change', () => {
  updateLabels();
  syncSourceMode();
  if (sourceEditor.getValue().trim()) doConvert();
});
toLang.addEventListener('change', () => {
  updateLabels();
  syncResultMode();
  if (sourceEditor.getValue().trim()) doConvert();
});

sourceEditor.on('change', () => {
  updateConvertBtn();
  clearTimeout(sourceEditor._debounce);
  sourceEditor._debounce = setTimeout(() => {
    updateStats();
    if (sourceEditor.getValue().trim()) doConvert();
  }, 500);
});

document.querySelectorAll('.chip').forEach(el => {
  el.addEventListener('click', () => loadExample(el.dataset.example));
});

sourceEditor.setOption('extraKeys', {
  'Ctrl-Enter': () => doConvert(),
  'Cmd-Enter': () => doConvert(),
});

// ---- 源码弹窗 ----
let sourceModalEditor = null;
document.getElementById('viewSourceBtn').addEventListener('click', () => {
  const overlay = document.getElementById('sourceModal');
  overlay.classList.add('open');
  const raw = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  const ta = document.getElementById('modalSourceCode');
  ta.value = raw;
  if (!sourceModalEditor) {
    sourceModalEditor = CodeMirror.fromTextArea(ta, {
      mode: 'htmlmixed',
      lineNumbers: true,
      matchBrackets: true,
      readOnly: true,
      lineWrapping: false,
      foldGutter: true,
      gutters: ['CodeMirror-foldgutter', 'CodeMirror-linenumbers'],
    });
  } else {
    sourceModalEditor.setValue(raw);
  }
  setTimeout(() => { sourceModalEditor.refresh(); sourceModalEditor.focus(); }, 50);
});
document.getElementById('modalCloseBtn').addEventListener('click', () => {
  document.getElementById('sourceModal').classList.remove('open');
});
document.getElementById('sourceModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) {
    document.getElementById('sourceModal').classList.remove('open');
  }
});
document.getElementById('modalCopyBtn').addEventListener('click', () => {
  const raw = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  navigator.clipboard.writeText(raw).then(() => {
    showToast('已复制全部源码');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = raw;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    showToast('已复制全部源码');
  });
});
// Escape 关闭弹窗
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.getElementById('sourceModal').classList.remove('open');
  }
});

// 初始化
updateLabels();
updateStats();
updateConvertBtn();
statusMsg.textContent = '就绪';
setTimeout(() => { sourceEditor.refresh(); resultEditor.refresh(); }, 100);
</script>
</body>
</html>
