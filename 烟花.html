<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多彩烟花 无残留版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background: #050a28;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<canvas id="fireCanvas"></canvas>

<script>
    const canvas = document.getElementById('fireCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const colorList = [
        '#ff3366', '#ffcc00', '#33ff99', '#33ccff', '#ff66ff',
        '#ff9933', '#99ff33', '#ff5599', '#66ccff', '#ffff66',
        '#ff4444', '#44ff44', '#4444ff', '#ff88ff', '#88ffff'
    ];

    // 形状生成器：返回 [{x, y}] 相对坐标数组（归一化到 radius 范围内）
    const shapeGenerators = {
        // 圆形
        circle(cx, cy, radius, count) {
            const pts = [];
            for (let i = 0; i < count; i++) {
                const a = (Math.PI * 2 / count) * i;
                pts.push({ x: Math.cos(a) * radius, y: Math.sin(a) * radius });
            }
            return pts;
        },
        // 心形
        heart(cx, cy, radius, count) {
            const pts = [];
            for (let i = 0; i < count; i++) {
                const t = (Math.PI * 2 / count) * i;
                const s = radius * 0.06;
                const hx = 16 * Math.pow(Math.sin(t), 3);
                const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                pts.push({ x: hx * s, y: hy * s });
            }
            return pts;
        },
        // 笑脸
        smiley(cx, cy, radius, count) {
            const pts = [];
            const faceR = radius * 0.8;
            const eyeR = radius * 0.15;
            const mouthR = radius * 0.45;
            // 脸轮廓
            const faceCount = Math.floor(count * 0.5);
            for (let i = 0; i < faceCount; i++) {
                const a = (Math.PI * 2 / faceCount) * i;
                pts.push({ x: Math.cos(a) * faceR, y: Math.sin(a) * faceR });
            }
            // 左眼
            const eyeCount = Math.floor(count * 0.1);
            for (let i = 0; i < eyeCount; i++) {
                const a = (Math.PI * 2 / eyeCount) * i;
                pts.push({ x: -faceR * 0.4 + Math.cos(a) * eyeR, y: -faceR * 0.2 + Math.sin(a) * eyeR });
            }
            // 右眼
            for (let i = 0; i < eyeCount; i++) {
                const a = (Math.PI * 2 / eyeCount) * i;
                pts.push({ x: faceR * 0.4 + Math.cos(a) * eyeR, y: -faceR * 0.2 + Math.sin(a) * eyeR });
            }
            // 嘴巴（弧形）
            const mouthCount = count - faceCount - eyeCount * 2;
            for (let i = 0; i < mouthCount; i++) {
                const a = (Math.PI * 0.15) + (Math.PI * 0.7 / mouthCount) * i;
                pts.push({ x: Math.cos(a) * mouthR, y: faceR * 0.25 + Math.sin(a) * mouthR * 0.5 });
            }
            return pts;
        },
        // 五角星
        star(cx, cy, radius, count) {
            const pts = [];
            const outerR = radius;
            const innerR = radius * 0.45;
            const spikes = 5;
            const totalPoints = spikes * 2;
            for (let i = 0; i < count; i++) {
                const seg = i % totalPoints;
                const a = (Math.PI * 2 / totalPoints) * seg - Math.PI / 2;
                const r = seg % 2 === 0 ? outerR : innerR;
                pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
            }
            return pts;
        },
        // 环形
        ring(cx, cy, radius, count) {
            const pts = [];
            const innerR = radius * 0.65;
            const outerR = radius;
            for (let i = 0; i < count; i++) {
                const a = (Math.PI * 2 / count) * i;
                const r = innerR + Math.random() * (outerR - innerR);
                pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
            }
            return pts;
        },
        // 三角形
        triangle(cx, cy, radius, count) {
            const pts = [];
            const corners = 3;
            for (let i = 0; i < count; i++) {
                const edge = Math.floor((i / count) * corners);
                const t = (i / count) * corners - edge;
                const a1 = (Math.PI * 2 / corners) * edge - Math.PI / 2;
                const a2 = (Math.PI * 2 / corners) * ((edge + 1) % corners) - Math.PI / 2;
                const x1 = Math.cos(a1) * radius, y1 = Math.sin(a1) * radius;
                const x2 = Math.cos(a2) * radius, y2 = Math.sin(a2) * radius;
                pts.push({ x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t });
            }
            return pts;
        },
        // 螺旋
        spiral(cx, cy, radius, count) {
            const pts = [];
            const turns = 3;
            for (let i = 0; i < count; i++) {
                const t = i / count;
                const a = turns * Math.PI * 2 * t;
                const r = radius * t;
                pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
            }
            return pts;
        },
        // 双环（奥运环风格）
        doubleRing(cx, cy, radius, count) {
            const pts = [];
            const half = Math.floor(count / 2);
            const r1 = radius * 0.7, r2 = radius;
            for (let i = 0; i < half; i++) {
                const a = (Math.PI * 2 / half) * i;
                pts.push({ x: Math.cos(a) * r1, y: Math.sin(a) * r1 });
            }
            for (let i = 0; i < count - half; i++) {
                const a = (Math.PI * 2 / (count - half)) * i;
                pts.push({ x: Math.cos(a) * r2, y: Math.sin(a) * r2 });
            }
            return pts;
        }
    };

    const shapeNames = Object.keys(shapeGenerators);

    // 拖尾粒子类（用于火箭尾迹和粒子拖尾）
    class TrailParticle {
        constructor(x, y, color, size) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.alpha = 1;
            this.size = size || 2;
        }
        update() {
            this.alpha -= 0.06;
            this.size *= 0.97;
        }
        draw() {
            if (this.alpha <= 0) return;
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color, speed, angle, decay, size) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.decay = decay;
            this.size = size || (Math.random() + 1);
            this.trail = []; // 粒子自身拖尾
            this.trailTimer = 0;
        }
        update() {
            // 记录拖尾
            this.trailTimer++;
            if (this.trailTimer % 2 === 0 && this.alpha > 0.3) {
                this.trail.push(new TrailParticle(this.x, this.y, this.color, this.size * 0.5));
            }
            // 更新拖尾
            for (let i = this.trail.length - 1; i >= 0; i--) {
                this.trail[i].update();
                if (this.trail[i].alpha <= 0) this.trail.splice(i, 1);
            }
            this.x += this.vx;
            this.vy += 0.04; // 重力
            this.y += this.vy;
            this.vx *= 0.99; // 空气阻力
            this.alpha -= this.decay;
            if (this.alpha < 0) this.alpha = 0;
        }
        draw() {
            // 先画拖尾
            this.trail.forEach(t => t.draw());
            if (this.alpha <= 0) return;
            ctx.save();
            ctx.globalAlpha = this.alpha;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.restore();
        }
    }

    class Rocket {
        constructor(targetX) {
            this.x = Math.random() * width;
            this.y = height;
            this.targetX = targetX || Math.random() * width;
            this.targetY = Math.random() * height * 0.4;
            this.speed = 6 + Math.random() * 2;
            this.exploded = false;
            this.particles = [];
            this.color = colorList[Math.floor(Math.random() * colorList.length)];
            this.shape = shapeNames[Math.floor(Math.random() * shapeNames.length)];
            this.trail = []; // 火箭拖尾
            this.sparks = []; // 火花粒子
        }
        update() {
            if (!this.exploded) {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 12) {
                    this.explode();
                } else {
                    this.x += dx / dist * this.speed;
                    this.y += dy / dist * this.speed;

                    // 添加主拖尾
                    this.trail.push(new TrailParticle(this.x, this.y, this.color, 3));
                    // 添加火花（随机偏移）
                    if (Math.random() > 0.3) {
                        const sparkColor = colorList[Math.floor(Math.random() * colorList.length)];
                        const sx = this.x + (Math.random() - 0.5) * 8;
                        const sy = this.y + (Math.random() - 0.5) * 8;
                        this.sparks.push(new TrailParticle(sx, sy, sparkColor, 1.5));
                    }

                    // 更新拖尾
                    for (let i = this.trail.length - 1; i >= 0; i--) {
                        this.trail[i].update();
                        if (this.trail[i].alpha <= 0) this.trail.splice(i, 1);
                    }
                    // 更新火花
                    for (let i = this.sparks.length - 1; i >= 0; i--) {
                        this.sparks[i].update();
                        if (this.sparks[i].alpha <= 0) this.sparks.splice(i, 1);
                    }

                    // 绘制发光拖尾
                    ctx.save();
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 15;
                    this.trail.forEach(t => t.draw());
                    ctx.restore();
                    this.sparks.forEach(s => s.draw());
                }
            } else {
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.update();
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    } else {
                        p.draw();
                    }
                }
            }
        }
        explode() {
            this.exploded = true;
            const count = 100 + Math.floor(Math.random() * 80);
            const radius = 60 + Math.random() * 50;
            const generator = shapeGenerators[this.shape];
            const points = generator(0, 0, radius, count);

            // 获取随机次级颜色
            const secondColor = colorList[Math.floor(Math.random() * colorList.length)];

            points.forEach((pt, i) => {
                const speed = Math.sqrt(pt.x * pt.x + pt.y * pt.y) * 0.04 + 0.5;
                const angle = Math.atan2(pt.y, pt.x);
                const decay = Math.random() * 0.015 + 0.008;
                const pColor = i % 3 === 0 ? secondColor : this.color;
                const size = Math.random() * 1.5 + 0.8;
                this.particles.push(new Particle(this.x, this.y, pColor, speed, angle, decay, size));
            });

            // 爆炸中心闪光
            for (let i = 0; i < 15; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = Math.random() * 5 + 2;
                this.particles.push(new Particle(this.x, this.y, '#ffffff', s, a, 0.05, 2));
            }
        }
    }

    let rockets = [];
    function autoLaunch() {
        rockets.push(new Rocket());
        setTimeout(autoLaunch, 600 + Math.random() * 1000);
    }
    autoLaunch();

    canvas.addEventListener('click', e => {
        rockets.push(new Rocket(e.clientX));
    });

    // 星空背景
    const stars = [];
    for (let i = 0; i < 150; i++) {
        stars.push({
            x: Math.random() * 2000,
            y: Math.random() * 1200,
            size: Math.random() * 1.5 + 0.3,
            alpha: Math.random() * 0.5 + 0.3,
            twinkle: Math.random() * 0.02
        });
    }

    function drawStars() {
        stars.forEach(s => {
            s.alpha += s.twinkle;
            if (s.alpha > 0.8 || s.alpha < 0.2) s.twinkle = -s.twinkle;
            ctx.save();
            ctx.globalAlpha = s.alpha;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        });
    }

    function animate() {
        ctx.fillStyle = '#050a28';
        ctx.fillRect(0, 0, width, height);

        drawStars();

        for (let i = rockets.length - 1; i >= 0; i--) {
            rockets[i].update();
            if (rockets[i].exploded && rockets[i].particles.length === 0) {
                rockets.splice(i, 1);
            }
        }
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
